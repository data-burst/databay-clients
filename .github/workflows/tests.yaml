name: tests

# Ruff, the client's tests and the regeneration check. The release workflow calls it on each tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "The commit to test; the calling run's commit when empty"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run --frozen ruff check

      - name: Ruff format
        run: uv run --frozen ruff format --check

      - name: Tests
        run: uv run --frozen pytest

      - name: Generated files match contract/
        run: uv run --frozen python tools/gen_client.py --check

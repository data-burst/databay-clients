name: release databay-cli

# Each push to main lets semantic-release pick the next version from the commits since the last
# python/v* tag, then builds, tests and publishes python/ to PyPI through trusted publishing. A
# GITHUB_TOKEN-pushed tag starts no workflow, so it all runs here. docs/cli.md has the details.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish again, like python/v0.2.0"
        required: true

permissions:
  contents: read

# Two releases at once would race for the same version and the push to main.
concurrency:
  group: release-databay-cli
  cancel-in-progress: false

jobs:
  version:
    name: pick the version and tag it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release commit, the tag and the GitHub release
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: semver
        if: github.event_name == 'push'
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          directory: python
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the tag to publish
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASED: ${{ steps.semver.outputs.released }}
          RELEASED_TAG: ${{ steps.semver.outputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASED" = "true" ]; then
            echo "tag=$RELEASED_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: check the tag and build
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Refuse a tag that is not this commit's release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: uv run --no-project --python 3.13 python python/tools/release_client.py check --tag "$TAG"

      - name: Read the version
        id: version
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: echo "version=${TAG#python/v}" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        working-directory: python
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  tests:
    name: tests
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ needs.version.outputs.tag }}

  smoke:
    name: smoke test (Python ${{ matrix.python }})
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the wheel in a fresh venv and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: python/tools/smoke_client_wheel.sh "dist/databay_cli-$VERSION-py3-none-any.whl" "$PYTHON_VERSION" "$VERSION"

  publish:
    name: publish to PyPI
    needs: [tests, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment the PyPI pending publisher names; its required reviewer approves each upload.
    environment:
      name: pypi
      url: https://pypi.org/project/databay-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

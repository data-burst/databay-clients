[project]
name = "databay-cli"
version = "0.1.2"
description = "Databay SDK and the databay CLI, generated from the Databay client contract"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7,<9",
    "httpx>=0.27.2,<1",
    "keyring>=25.5.0,<26",
    "platformdirs>=4.3.6,<5",
    "pydantic>=2.9.2,<3",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://databurst.tech"
Repository = "https://github.com/data-burst/databay-clients"
Changelog = "https://github.com/data-burst/databay-clients/blob/main/python/CHANGELOG.md"

[project.scripts]
databay = "databay.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyyaml>=6.0.2",
    "ruff>=0.15.12",
]

[build-system]
# Exact, so the wheel a tag publishes is built by the backend the PR was tested with.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databay"]

# python-semantic-release, run by the release workflow from python/; see docs/cli.md.
[tool.semantic_release]
tag_format = "python/v{version}"
commit_message = "chore(release): databay-cli v{version} [skip ci]"
# Start at 0.x like the unreleased package: without it, the first release is 1.0.0.
allow_zero_version = true
# release_client.py owns the version: pyproject.toml, uv.lock and the generated version.py. They are
# staged here, not listed as `assets`: semantic-release also uploads assets to the GitHub release, from
# the wrong folder, and fails after tagging.
build_command = "python3 tools/release_client.py stamp \"$NEW_VERSION\" && git add pyproject.toml uv.lock src/databay/version.py"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
# The first release would otherwise list every commit since the repository began.
mask_initial_release = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
# Generated by tools/gen_client.py; the regeneration check owns them.
extend-exclude = [
    "src/databay/models",
    "src/databay/operations",
    "src/databay/resources",
    "src/databay/cli/commands",
    "src/databay/api.py",
    "src/databay/spec.py",
    "src/databay/error_codes.py",
    "src/databay/version.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",
    "D203",
    "D211",
    "D212",
    "COM812",
    "ISC001",
    "EM101",
    "EM102",
    "TRY003",
    "CPY001",
    "S101",
    "PLR0913",
    "FBT001",
    "FBT002",
    # Docstrings say what a function returns ("The project ``op`` is sent for.").
    "D401",
    # The exception names are part of the SDK's API (DatabayServerUnavailable, DatabayResponseInvalid).
    "N818",
    "PLR0917",
    "C901",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Command-line scripts run by path: they print their result, the type mapping returns early per case, and
# the generator imports the client's runtime modules only after registering the package namespace.
"tools/**" = ["T201", "INP001", "PLR0911", "PLC0415"]
"tests/**" = ["ANN", "D", "INP001", "PLR2004", "S105", "S106", "S603", "S607", "SLF001", "ARG001", "PT011", "PLC0415", "TC002", "TC003"]

[project]
name = "databay-cli"
version = "0.1.0"
description = "Databay SDK and the databay CLI, generated from the Databay client contract"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7,<9",
    "httpx>=0.27.2,<1",
    "keyring>=25.5.0,<26",
    "platformdirs>=4.3.6,<5",
    "pydantic>=2.9.2,<3",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://databurst.tech"
Repository = "https://github.com/data-burst/databay-clients"
Changelog = "https://github.com/data-burst/databay-clients/blob/main/python/CHANGELOG.md"

[project.scripts]
databay = "databay.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
# Generated by tools/gen_client.py; the regeneration check owns them.
extend-exclude = [
    "src/databay/models",
    "src/databay/operations",
    "src/databay/resources",
    "src/databay/cli/commands",
    "src/databay/api.py",
    "src/databay/spec.py",
    "src/databay/error_codes.py",
    "src/databay/version.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",
    "D203",
    "D211",
    "D212",
    "COM812",
    "ISC001",
    "EM101",
    "EM102",
    "TRY003",
    "CPY001",
    "S101",
    "PLR0913",
    "FBT001",
    "FBT002",
    # Docstrings say what a function returns ("The project ``op`` is sent for."), as in the backend.
    "D401",
    # The exception names are the design's (DatabayServerUnavailable, DatabayResponseInvalid).
    "N818",
    "PLR0917",
    "C901",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Command-line scripts run by path: they print their result, the type mapping returns early per case, and
# the generator imports the client's runtime modules only after registering the package namespace.
"tools/**" = ["T201", "INP001", "PLR0911", "PLC0415"]
"tests/**" = ["ANN", "D", "INP001", "PLR2004", "S105", "S106", "S603", "S607", "SLF001", "ARG001", "PT011", "PLC0415", "TC002", "TC003"]
